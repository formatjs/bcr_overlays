name: Cross-compiled Chromium components
on: [push, pull_request]
concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  toolchains:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-arm64, windows-amd64, windows-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-version: components-${{ matrix.platform }}
      - name: Cross-compile platform components
        env:
          PLATFORM: ${{ matrix.platform }}
          BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
          BAZEL_WINDOWS_SDK_EULA: '1'
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
        run: |
          targets=()
          for probe in rust expat allocator base ipc network graphics v8 dawn angle gpu; do
            targets+=("//tools/ci:$probe-$PLATFORM")
          done
          if [[ "$PLATFORM" == windows-* ]]; then
            targets+=("//tools/ci:dxc-$PLATFORM")
          fi
          cache=()
          if [[ -n "$BUILDBUDDY_API_KEY" ]]; then
            cache+=(--remote_cache=grpcs://formatjs.buildbuddy.io
              "--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              --remote_upload_local_results=false --remote_download_outputs=toplevel)
          fi
          bazel build --jobs=4 "${cache[@]}" \
            --repo_env=BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA \
            --repo_env=BAZEL_WINDOWS_SDK_EULA "${targets[@]}"
      - name: Collect native smoke artifacts
        run: python3 -m tools.ci.collect_allocator_probes --platform "${{ matrix.platform }}" --output "$RUNNER_TEMP/allocator-probes"
      - uses: actions/upload-artifact@v7
        with:
          name: allocators-${{ github.sha }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/allocator-probes/*
          if-no-files-found: error
  linux-toolchains:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-version: components-linux
      - name: Cross-compile Linux Rust and XML parsers
        run: >-
          bazel build --jobs=4
          //tools/ci:rust-linux-amd64 //tools/ci:rust-linux-arm64
          //tools/ci:expat-linux-amd64 //tools/ci:expat-linux-arm64
      - name: Run native XML parser probe
        run: bazel run --jobs=4 //tools/ci:expat_toolchain_probe
      - name: Run native Rust probe
        run: bazel run --jobs=4 //tools/ci:rust_toolchain_probe
  windows-allocator:
    if: ${{ !cancelled() }}
    needs: toolchains
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: allocators-${{ github.sha }}-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/allocator-probes
      - name: Exercise cross-compiled allocator
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/allocator-probes/allocator-windows-${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise cross-compiled Chromium base
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/allocator-probes/base-windows-${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise cross-compiled Chromium IPC
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/allocator-probes/ipc-windows-${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise cross-compiled Chromium TCP sockets
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/allocator-probes/network-windows-${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise cross-compiled V8
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/allocator-probes/v8-windows-${{ matrix.arch }}/v8-windows-${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Dawn validation and buffer mapping
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/allocator-probes/dawn-windows-${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Load ANGLE EGL and GLES DLLs
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP/allocator-probes/angle-windows-${{ matrix.arch }}"
          & "$bundle/angle-windows-${{ matrix.arch }}.exe" "$bundle/libEGL.dll" "$bundle/libGLESv2.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise GPU command buffer
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP/allocator-probes/gpu-windows-${{ matrix.arch }}"
          & "$bundle/gpu-windows-${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile HLSL with shipped DXC
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/allocator-probes/dxc-windows-${{ matrix.arch }}/dxc-windows-${{ matrix.arch }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render and round-trip PNG pixels
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/allocator-probes/graphics-windows-${{ matrix.arch }}.exe" "$env:RUNNER_TEMP/graphics-windows-${{ matrix.arch }}.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graphics-windows-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/graphics-windows-${{ matrix.arch }}.png
          if-no-files-found: ignore
          retention-days: 7
  darwin-allocator:
    if: ${{ !cancelled() }}
    needs: toolchains
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: allocators-${{ github.sha }}-darwin-arm64
          path: ${{ runner.temp }}/allocator-probes
      - name: Exercise cross-compiled allocator
        run: |
          chmod +x "$RUNNER_TEMP/allocator-probes/allocator-darwin-arm64"
          "$RUNNER_TEMP/allocator-probes/allocator-darwin-arm64"
      - name: Exercise cross-compiled Chromium base
        run: |
          chmod +x "$RUNNER_TEMP/allocator-probes/base-darwin-arm64"
          "$RUNNER_TEMP/allocator-probes/base-darwin-arm64"
      - name: Exercise cross-compiled Chromium IPC
        run: |
          chmod +x "$RUNNER_TEMP/allocator-probes/ipc-darwin-arm64"
          "$RUNNER_TEMP/allocator-probes/ipc-darwin-arm64"
      - name: Exercise cross-compiled Chromium TCP sockets
        run: |
          chmod +x "$RUNNER_TEMP/allocator-probes/network-darwin-arm64"
          "$RUNNER_TEMP/allocator-probes/network-darwin-arm64"
      - name: Exercise cross-compiled V8
        run: |
          chmod +x "$RUNNER_TEMP/allocator-probes/v8-darwin-arm64/v8-darwin-arm64"
          "$RUNNER_TEMP/allocator-probes/v8-darwin-arm64/v8-darwin-arm64"
      - name: Exercise Dawn validation and buffer mapping
        run: |
          chmod +x "$RUNNER_TEMP/allocator-probes/dawn-darwin-arm64"
          "$RUNNER_TEMP/allocator-probes/dawn-darwin-arm64"
      - name: Load ANGLE and exercise EGL/GLES dispatch
        run: |
          directory="$RUNNER_TEMP/allocator-probes/angle-darwin-arm64"
          chmod +x "$directory/angle-darwin-arm64" "$directory/"*.dylib
          "$directory/angle-darwin-arm64" "$directory/libEGL.dylib" "$directory/libGLESv2.dylib"
      - name: Exercise GPU command buffer
        run: |
          directory="$RUNNER_TEMP/allocator-probes/gpu-darwin-arm64"
          chmod +x "$directory/gpu-darwin-arm64" "$directory/"*.dylib
          "$directory/gpu-darwin-arm64"
      - name: Render and round-trip PNG pixels
        run: |
          chmod +x "$RUNNER_TEMP/allocator-probes/graphics-darwin-arm64"
          "$RUNNER_TEMP/allocator-probes/graphics-darwin-arm64" "$RUNNER_TEMP/graphics-darwin-arm64.png"
      - name: Upload native rendering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graphics-darwin-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/graphics-darwin-arm64.png
          if-no-files-found: ignore
          retention-days: 7
