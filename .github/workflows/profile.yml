name: Profile BuildBuddy builds
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full source commit SHA to profile
        required: true
        type: string
      baseline:
        description: Optional green commit for browser payload byte comparison
        required: false
        type: string
      revision_kind:
        description: Candidate browser build type
        type: choice
        default: browser
        options: [browser, cold-browser]
      platform:
        description: Platforms to compare
        type: choice
        default: all
        options: [all, linux-amd64, linux-arm64, darwin-arm64, windows-amd64, windows-arm64]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Collect Bazel metrics and sanitized timing summaries
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ inputs.revision }}
        run: python3 -m tools.ci.profile_buildbuddy --revision "$BUILD_SHA" --directory "$RUNNER_TEMP/build-profile"
      - name: Compare browser payload bytes
        if: inputs.baseline != ''
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_RO_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ inputs.revision }}
          BASELINE_SHA: ${{ inputs.baseline }}
          REVISION_KIND: ${{ inputs.revision_kind }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          arguments=(--baseline "$BASELINE_SHA" --revision "$BUILD_SHA" --directory "$RUNNER_TEMP/build-profile" --revision-kind "$REVISION_KIND")
          if [[ "$PLATFORM" != all ]]; then arguments+=(--platform "$PLATFORM"); fi
          python3 -m tools.ci.compare_payloads "${arguments[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-profile-${{ inputs.revision }}
          path: ${{ runner.temp }}/build-profile
          if-no-files-found: error
          retention-days: 7
