name: Chromium artifact smoke

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Execute downloaded Chromium
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      TARGET_PLATFORM: ${{ inputs.platform }}
      SOURCE_REVISION: ${{ inputs.revision }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned screenshot tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r tools/ci/rendering/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: chromium-${{ inputs.platform }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/chromium-artifact
      - name: Allow Chromium user namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check architecture, provenance and browser behavior
        shell: bash
        run: >-
          python tools/ci/chromium.py smoke
          --platform "$TARGET_PLATFORM" --revision "$SOURCE_REVISION"
          --artifact "$RUNNER_TEMP/chromium-artifact/chromium-$TARGET_PLATFORM.tar.gz"
          --directory "$RUNNER_TEMP/relocated-chromium"
          --screenshots "$RUNNER_TEMP/chromium-screenshots"
      - name: Upload rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-rendering-${{ inputs.platform }}-${{ inputs.revision }}
          path: ${{ runner.temp }}/chromium-screenshots
          if-no-files-found: ignore
          retention-days: 7
