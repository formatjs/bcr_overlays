bcr_test_module:
  module_path: bcr_test
  matrix:
    bazel: ["8.x", "9.x"]
  tasks:
    consumer:
      name: Native v8 with hermetic LLVM
      platform: ubuntu2404
      bazel: ${{ bazel }}
      build_targets: ["@v8//:noicu/d8", "@v8//:icu/d8"]
      test_targets: ["//:smoke_test", "//:intl_test"]
